spring.datasource.url=jdbc:h2:mem:logifresh_pedidos_test;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable SQL init in tests (data.sql uses PostgreSQL ON CONFLICT; tests manage their own data)
spring.sql.init.mode=never

# URLs se sobrescriben dinamicamente via @DynamicPropertySource en cada test
inventario.service.url=http://placeholder:9999/api/inventario
facturacion.service.url=http://placeholder:9999/api/facturas
notificaciones.service.url=http://placeholder:9999/api/notificaciones
transporte.service.url=http://placeholder:9999/api/transporte
webclient.timeout.ms=2000
