spring.application.name=pedidos-service
server.port=${SERVER_PORT:8081}

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logifresh_pedidos}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# External Service URLs (override via env vars: INVENTARIO_SERVICE_URL, etc.)
inventario.service.url=http://localhost:8082/api/inventario
facturacion.service.url=http://localhost:8083/api/facturas
notificaciones.service.url=http://localhost:8085/api/notificaciones
transporte.service.url=http://localhost:8084/api/transporte

# WebClient timeout (can override via env var WEBCLIENT_TIMEOUT_MS)
webclient.timeout.ms=5000

# Logging
logging.level.com.logifresh.pedidos.service.OrquestacionService=INFO
logging.level.com.logifresh.pedidos.service.FacturacionClient=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# Data initialization
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
