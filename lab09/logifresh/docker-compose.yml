services:

  postgres:
    image: postgres:16
    container_name: logifresh-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: logifresh
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - logifresh-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pedidos-service:
    build:
      context: .
      dockerfile: pedidos-service/Dockerfile
    container_name: logifresh-pedidos
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: logifresh_pedidos
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      INVENTARIO_SERVICE_URL: http://inventario-service:8082/api/inventario
      FACTURACION_SERVICE_URL: http://facturacion-service:8083/api/facturas
      NOTIFICACIONES_SERVICE_URL: http://notificaciones-service:8085/api/notificaciones
      TRANSPORTE_SERVICE_URL: http://transporte-service:8084/api/transporte
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - logifresh-network

  inventario-service:
    build:
      context: .
      dockerfile: inventario-service/Dockerfile
    container_name: logifresh-inventario
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: logifresh_inventario
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - logifresh-network

  facturacion-service:
    build:
      context: .
      dockerfile: facturacion-service/Dockerfile
    container_name: logifresh-facturacion
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: logifresh_facturacion
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - logifresh-network

  transporte-service:
    build:
      context: .
      dockerfile: transporte-service/Dockerfile
    container_name: logifresh-transporte
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: logifresh_transporte
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - logifresh-network

  notificaciones-service:
    build:
      context: .
      dockerfile: notificaciones-service/Dockerfile
    container_name: logifresh-notificaciones
    restart: unless-stopped
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: logifresh_notificaciones
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - logifresh-network

  frontend-app:
    build:
      context: .
      dockerfile: frontend-app/Dockerfile
    container_name: logifresh-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      PEDIDOS_SERVICE_URL: http://pedidos-service:8081/api/pedidos
      INVENTARIO_SERVICE_URL: http://inventario-service:8082/api/productos
      FACTURACION_SERVICE_URL: http://facturacion-service:8083/api/facturas
      TRANSPORTE_SERVICE_URL: http://transporte-service:8084/api/transportes
      NOTIFICACIONES_SERVICE_URL: http://notificaciones-service:8085/api/notificaciones
    depends_on:
      - pedidos-service
      - inventario-service
      - facturacion-service
      - transporte-service
      - notificaciones-service
    networks:
      - logifresh-network

volumes:
  pgdata:

networks:
  logifresh-network:
    driver: bridge
