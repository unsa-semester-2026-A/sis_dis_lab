<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gRPC Converter - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-4xl w-full glass rounded-3xl shadow-2xl overflow-hidden border border-white/20">
        <div class="bg-indigo-600 p-8 text-white">
            <h1 class="text-3xl font-bold">Convertidor gRPC</h1>
            <p class="text-indigo-100 mt-2">Interfaz interactiva para servicios de conversión</p>
        </div>

        <div class="p-8 grid md:grid-cols-2 gap-8">
            <!-- Formulario -->
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Tipo de Conversión</label>
                    <select id="type" class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all">
                        <option value="celsius">Celsius a Fahrenheit</option>
                        <option value="soles">Soles a Dólares</option>
                        <option value="km">Kilómetros a Millas</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">Valor a Convertir</label>
                    <input type="number" id="value" step="any" placeholder="Ej: 25.5" 
                        class="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none transition-all">
                </div>

                <button onclick="convert()" id="btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-indigo-200 transition-all flex items-center justify-center gap-2">
                    <span id="btnText">Convertir Ahora</span>
                    <svg id="loader" class="hidden animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                </button>
            </div>

            <!-- Resultado -->
            <div class="bg-slate-100 rounded-2xl p-8 flex flex-col items-center justify-center border border-slate-200 relative overflow-hidden">
                <div class="text-slate-500 text-sm uppercase tracking-widest font-bold mb-4">Resultado</div>
                <div id="result" class="text-5xl font-black text-indigo-900 transition-all">--</div>
                <div id="unit" class="text-slate-400 mt-2 font-medium">esperando entrada...</div>
                
                <!-- Decoración -->
                <div class="absolute -bottom-10 -right-10 w-32 h-32 bg-indigo-500/10 rounded-full blur-3xl"></div>
            </div>
        </div>

        <!-- Logs de Red -->
        <div class="border-t border-slate-100 p-6 bg-slate-50/50">
            <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Trazabilidad gRPC</h3>
            <div id="logs" class="space-y-2 max-h-40 overflow-y-auto font-mono text-xs">
                <div class="text-slate-400 italic">No hay peticiones recientes...</div>
            </div>
        </div>
    </div>

    <script>
        async function convert() {
            const type = document.getElementById('type').value;
            const value = parseFloat(document.getElementById('value').value);
            const btn = document.getElementById('btn');
            const btnText = document.getElementById('btnText');
            const loader = document.getElementById('loader');
            const resultDiv = document.getElementById('result');
            const unitDiv = document.getElementById('unit');
            const logs = document.getElementById('logs');

            if (isNaN(value)) {
                alert('Por favor, ingresa un valor válido');
                return;
            }

            // UI Loading
            btn.disabled = true;
            btnText.textContent = 'Procesando...';
            loader.classList.remove('hidden');
            resultDiv.classList.add('opacity-50');

            try {
                const response = await fetch('/api/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type, value })
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.textContent = data.result.toFixed(2);
                    unitDiv.textContent = getUnit(type);
                    addLog(`SUCCESS: ${type}(${value}) -> ${data.result.toFixed(2)}`, 'text-green-600');
                } else {
                    resultDiv.textContent = 'Error';
                    unitDiv.textContent = data.error;
                    addLog(`ERROR: ${data.error}`, 'text-red-600');
                }
            } catch (err) {
                console.error(err);
                addLog('CRITICAL: Servidor Web no disponible', 'text-red-800');
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Convertir Ahora';
                loader.classList.add('hidden');
                resultDiv.classList.remove('opacity-50');
            }
        }

        function getUnit(type) {
            const units = {
                'celsius': 'Fahrenheit (°F)',
                'soles': 'Dólares ($)',
                'km': 'Millas (mi)'
            };
            return units[type] || '';
        }

        function addLog(msg, color) {
            const div = document.createElement('div');
            div.className = `p-2 rounded bg-white border border-slate-200 ${color}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            const logsContainer = document.getElementById('logs');
            if (logsContainer.children[0]?.classList.contains('italic')) {
                logsContainer.innerHTML = '';
            }
            logsContainer.prepend(div);
        }
    </script>
</body>
</html>
