<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .title { font-family: 'Outfit', 'Inter', sans-serif; font-size: 24px; fill: #58a6ff; font-weight: bold; }
      .subtitle { font-family: 'Inter', sans-serif; font-size: 14px; fill: #8b949e; }
      .box { rx: 12px; stroke-width: 2px; }
      .box-client { fill: #161b22; stroke: #58a6ff; }
      .box-gateway { fill: #161b22; stroke: #bc8cff; }
      .box-auth { fill: #161b22; stroke: #ff7b72; }
      .box-db { fill: #161b22; stroke: #3fb950; }
      .box-mfa { fill: #161b22; stroke: #d29922; }
      .text-node { font-family: 'Inter', sans-serif; font-size: 15px; fill: #c9d1d9; font-weight: 600; text-anchor: middle; }
      .text-role { font-family: 'Inter', sans-serif; font-size: 12px; fill: #8b949e; text-anchor: middle; }
      .line { stroke: #30363d; stroke-width: 2px; stroke-dasharray: 6 4; }
      .arrow { stroke: #58a6ff; stroke-width: 2px; fill: none; marker-end: url(#arrowhead); }
      .arrow-success { stroke: #3fb950; stroke-width: 2px; fill: none; marker-end: url(#arrowhead-success); }
      .arrow-alert { stroke: #ff7b72; stroke-width: 2px; fill: none; marker-end: url(#arrowhead-alert); }
      .arrow-text { font-family: 'Inter', sans-serif; font-size: 11px; fill: #8b949e; }
      .arrow-text-highlight { font-family: 'Inter', sans-serif; font-size: 11px; fill: #58a6ff; font-weight: bold; }
      .arrow-text-alert { font-family: 'Inter', sans-serif; font-size: 11px; fill: #ff7b72; font-weight: bold; }
      .badge { rx: 4px; fill: #21262d; stroke: #30363d; }
      .badge-text { font-family: 'Inter', sans-serif; font-size: 11px; fill: #c9d1d9; text-anchor: middle; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff" />
    </marker>
    <marker id="arrowhead-success" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950" />
    </marker>
    <marker id="arrowhead-alert" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7b72" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" class="bg" />

  <!-- Headers -->
  <text x="50" y="50" class="title">LogiMarket Perú — Arquitectura de Autenticación Segura (MFA + Lockout + Revocación)</text>
  <text x="50" y="75" class="subtitle">Flujo seguro de inicio de sesión con prevención de accesos concurrentes no autorizados (Incidente 5)</text>

  <!-- Life Lines (Vertical lines) -->
  <!-- Client (x = 150) -->
  <line x1="150" y1="180" x2="150" y2="580" class="line" />
  <!-- API Gateway (x = 350) -->
  <line x1="350" y1="180" x2="350" y2="580" class="line" />
  <!-- Auth Service (x = 600) -->
  <line x1="600" y1="180" x2="600" y2="580" class="line" />
  <!-- Database / Cache (x = 850) -->
  <line x1="850" y1="180" x2="850" y2="580" class="line" />

  <!-- Lifeline Headers (Boxes) -->
  <!-- Client -->
  <rect x="70" y="120" width="160" height="60" class="box box-client" />
  <text x="150" y="145" class="text-node">Cliente (App/Web)</text>
  <text x="150" y="165" class="text-role">Usuario Final</text>

  <!-- API Gateway -->
  <rect x="270" y="120" width="160" height="60" class="box box-gateway" />
  <text x="350" y="145" class="text-node">API Gateway</text>
  <text x="350" y="165" class="text-role">Proxy &amp; Rate Limit</text>

  <!-- Auth Service -->
  <rect x="520" y="120" width="160" height="60" class="box box-auth" />
  <text x="600" y="145" class="text-node">Servicio de Auth</text>
  <text x="600" y="165" class="text-role">Identity Provider</text>

  <!-- DB / Cache -->
  <rect x="770" y="120" width="160" height="60" class="box box-db" />
  <text x="850" y="145" class="text-node">Base de Datos / Redis</text>
  <text x="850" y="165" class="text-role">User DB &amp; Session Store</text>

  <!-- Flow Steps -->
  
  <!-- Step 1: Login request -->
  <path d="M 150 220 L 342 220" class="arrow" />
  <text x="165" y="212" class="arrow-text-highlight">1. POST /auth/login (user, pass, device_info, IP)</text>

  <!-- Step 1.1: Proxy to Auth -->
  <path d="M 350 235 L 592 235" class="arrow" />
  <text x="365" y="230" class="arrow-text">Forward login request</text>

  <!-- Step 2: DB Verification -->
  <path d="M 600 260 L 842 260" class="arrow" />
  <text x="615" y="252" class="arrow-text">2. Get user info (hash scrypt, status, attempts)</text>
  
  <path d="M 850 280 L 608 280" class="arrow" />
  <text x="640" y="275" class="arrow-text">Return user details (Not locked? True)</text>

  <!-- Validation (Lockout Check) -->
  <g transform="translate(490, 290)">
    <rect width="220" height="40" class="badge" />
    <text x="110" y="25" class="badge-text">Valida password &amp; Lockout &lt; 3</text>
  </g>

  <!-- Step 3: Session Conflict & Geolocation Check -->
  <path d="M 600 360 L 842 360" class="arrow" />
  <text x="615" y="352" class="arrow-text-highlight">3. Check Active Sessions (IP conflict / Concurrent?)</text>
  
  <!-- If conflict detected -> Revoke previous -->
  <path d="M 850 390 L 608 390" class="arrow-alert" />
  <text x="620" y="382" class="arrow-text-alert">Conflict detected! Revoke old session &amp; Blacklist token</text>

  <!-- Step 4: MFA Challenge -->
  <path d="M 600 430 L 158 430" class="arrow-alert" />
  <text x="175" y="422" class="arrow-text-alert">4. Return MFA Challenge (MFA Secret required)</text>

  <!-- Step 5: Send TOTP -->
  <path d="M 150 480 L 592 480" class="arrow" />
  <text x="165" y="472" class="arrow-text-highlight">5. POST /auth/mfa-verify (code: 489210)</text>

  <!-- Step 6: Validate and Token generation -->
  <path d="M 600 510 L 842 510" class="arrow-success" />
  <text x="615" y="502" class="arrow-text">6. Save new session &amp; Register Token</text>

  <!-- Step 7: Return JWT -->
  <path d="M 600 550 L 158 550" class="arrow-success" />
  <text x="175" y="542" class="arrow-text-highlight">7. HTTP 200 OK — Return Access Token (JWT) + Refresh Token</text>

</svg>
